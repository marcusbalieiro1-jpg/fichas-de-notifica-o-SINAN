/* =========================================================================
   HABE SINAN — folha de estilo principal
   Hospital de Aeronáutica de Belém · Núcleo de Epidemiologia
   ========================================================================= */

/* ---------- 1. Variáveis ---------- */
:root {
  --azul-escuro:  #0b2f5c;
  --azul:         #1b5aa8;
  --azul-claro:   #eaf1fa;
  --dourado:      #d99a1f;
  --dourado-claro:#fdf6e6;

  --urgente:      #c62828;
  --urgente-bg:   #fdecea;
  --urgente-borda:#f2b8b5;
  --atencao:      #a45c00;
  --atencao-bg:   #fff6e5;
  --atencao-borda:#f0d09a;
  --sucesso:      #1b7a4b;
  --sucesso-bg:   #e8f5ee;

  --texto:        #16202c;
  --texto-suave:  #56657a;
  --fundo:        #f4f6f9;
  --superficie:   #ffffff;
  --borda:        #dde3ec;

  --raio:         12px;
  --raio-p:       8px;
  --sombra:       0 1px 2px rgba(11,47,92,.06), 0 6px 18px rgba(11,47,92,.07);
  --sombra-forte: 0 10px 40px rgba(11,47,92,.20);
  --fonte: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
}

[data-tema="escuro"] {
  --azul-claro:   #16283f;
  --dourado-claro:#2e2412;
  --urgente-bg:   #3a1a19;
  --urgente-borda:#7a3330;
  --atencao-bg:   #33260f;
  --atencao-borda:#7a5a1f;
  --sucesso-bg:   #12301f;
  --texto:        #e7edf5;
  --texto-suave:  #9fb0c6;
  --fundo:        #0d1520;
  --superficie:   #14202f;
  --borda:        #26364a;
  --sombra:       0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}

/* ---------- 2. Base ---------- */
* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--fonte);
  font-size: 16px;
  line-height: 1.55;
  color: var(--texto);
  background: var(--fundo);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5rem; font-weight: 700; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
p  { margin: 0 0 .8rem; }
a  { color: var(--azul); }

.oculto { display: none !important; }
.so-leitor-tela {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------- 3. Cabeçalho ---------- */
.cabecalho {
  background: linear-gradient(135deg, var(--azul-escuro) 0%, #123f77 100%);
  color: #fff;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}

.cabecalho__topo {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; gap: .9rem;
  padding: .7rem 1rem;
}

/* O brasão é vertical (5:6): fixa-se a altura e deixa a largura livre, para
   que o emblema não apareça achatado — vale também se for trocado por PNG. */
.cabecalho__logo { height: 52px; width: auto; flex: 0 0 auto; }
.brasao--comprovante { height: 62px; width: auto; }
.brasao--cartaz      { height: 132px; width: auto; }
.brasao--destrava    { height: 84px; width: auto; }

.cabecalho__titulo { flex: 1 1 auto; min-width: 0; }
.cabecalho__titulo strong {
  display: block; font-size: 1.25rem; letter-spacing: .04em; font-weight: 800;
}
/* Só o subtítulo (filho direto) vira bloco. Um span dentro do <strong>, como
   o selo "· NÚCLEO", precisa continuar na mesma linha do nome do sistema. */
.cabecalho__titulo > span {
  display: block; font-size: .78rem; color: #bcd4f0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cabecalho__marca {
  font-size: .62em; letter-spacing: .08em; opacity: .85; white-space: nowrap;
}

.cabecalho__acoes { display: flex; gap: .4rem; flex: 0 0 auto; }

.botao-icone {
  background: rgba(255,255,255,.12); color: #fff; border: 0;
  width: 38px; height: 38px; border-radius: 50%;
  font-size: 1.05rem; cursor: pointer; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.botao-icone:hover { background: rgba(255,255,255,.26); }
.botao-icone--ativo { background: var(--dourado); color: #10233c; }

/* ---------- 4. Navegação ---------- */
.navegacao {
  background: rgba(0,0,0,.16);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.navegacao__lista {
  max-width: 1200px; margin: 0 auto; padding: 0 .6rem;
  display: flex; gap: .15rem; list-style: none;
}
.navegacao a {
  display: block; padding: .62rem .85rem; white-space: nowrap;
  color: #cfe0f5; text-decoration: none; font-size: .9rem; font-weight: 600;
  border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
}
.navegacao a:hover { color: #fff; }
.navegacao a.ativo { color: #fff; border-bottom-color: var(--dourado); }
.navegacao__contador {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: .35rem;
  background: var(--dourado); color: #10233c;
  border-radius: 9px; font-size: .7rem; font-weight: 800; text-align: center;
}

/* ---------- 5. Layout ---------- */
.conteudo { max-width: 1200px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
.pagina { animation: surgir .18s ease-out; }
@keyframes surgir { from { opacity: 0; transform: translateY(6px); } }

.pagina__cabecalho { margin-bottom: 1.1rem; }
.pagina__cabecalho p { color: var(--texto-suave); margin: 0; }

.cartao {
  background: var(--superficie); border: 1px solid var(--borda);
  border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 1.1rem; margin-bottom: 1.1rem;
}
.cartao__titulo {
  display: flex; align-items: center; justify-content: space-between;
  gap: .6rem; margin-bottom: .8rem; flex-wrap: wrap;
}
.cartao__titulo h2, .cartao__titulo h3 { margin: 0; }

.grade { display: grid; gap: 1rem; }
.grade--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade--3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grade--4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

/* ---------- 6. Botões ---------- */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  padding: .62rem 1.05rem; border-radius: var(--raio-p);
  border: 1px solid transparent; background: var(--azul); color: #fff;
  font: inherit; font-weight: 600; font-size: .92rem;
  cursor: pointer; text-decoration: none; transition: filter .15s, background .15s;
}
.botao:hover { filter: brightness(1.08); }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.botao--secundario {
  background: var(--superficie); color: var(--azul); border-color: var(--borda);
}
.botao--perigo   { background: var(--urgente); }
.botao--sucesso  { background: var(--sucesso); }
.botao--grande   { padding: .85rem 1.4rem; font-size: 1rem; }
.botao--bloco    { width: 100%; }
.botao--pequeno  { padding: .38rem .7rem; font-size: .82rem; }

/* ---------- 7. Formulários ---------- */
.campo { margin-bottom: .95rem; }
.campo > label {
  display: block; font-weight: 600; font-size: .87rem; margin-bottom: .3rem;
}
.campo__dica { display: block; font-weight: 400; color: var(--texto-suave); font-size: .8rem; }
.campo__erro { color: var(--urgente); font-size: .82rem; margin-top: .25rem; display: none; }
.campo--invalido .campo__erro { display: block; }
.campo--invalido input, .campo--invalido select, .campo--invalido textarea {
  border-color: var(--urgente);
}
.obrigatorio { color: var(--urgente); }

input[type="text"], input[type="date"], input[type="email"], input[type="tel"],
input[type="search"], input[type="number"], input[type="password"], select, textarea {
  width: 100%; padding: .62rem .7rem; font: inherit; font-size: .95rem;
  color: var(--texto); background: var(--superficie);
  border: 1px solid var(--borda); border-radius: var(--raio-p);
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--azul);
  box-shadow: 0 0 0 3px rgba(27,90,168,.18);
}
textarea { min-height: 82px; resize: vertical; }

.opcoes { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.opcao {
  display: flex; align-items: flex-start; gap: .55rem; cursor: pointer;
  padding: .65rem .8rem; border: 1px solid var(--borda);
  border-radius: var(--raio-p); background: var(--superficie);
  transition: border-color .15s, background .15s;
}
.opcao:hover { border-color: var(--azul); }
.opcao input { margin: .2rem 0 0; flex: 0 0 auto; accent-color: var(--azul); }
.opcao__texto { font-size: .9rem; line-height: 1.35; }
.opcao__texto strong { display: block; }
.opcao__texto small { color: var(--texto-suave); }
.opcao:has(input:checked) { border-color: var(--azul); background: var(--azul-claro); }

/* ---------- 8. Selos de classificação ---------- */
.selo {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .17rem .55rem; border-radius: 999px;
  font-size: .74rem; font-weight: 800; letter-spacing: .02em;
  border: 1px solid transparent; white-space: nowrap;
}
.selo--urgente { background: var(--urgente-bg); color: var(--urgente); border-color: var(--urgente-borda); }
.selo--atencao { background: var(--atencao-bg); color: var(--atencao); border-color: var(--atencao-borda); }
.selo--padrao  { background: var(--azul-claro); color: var(--azul); border-color: var(--borda); }
.selo--neutro  { background: var(--fundo); color: var(--texto-suave); border-color: var(--borda); }
.selo--sucesso { background: var(--sucesso-bg); color: var(--sucesso); border-color: var(--sucesso); }

.ponto {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto;
}
.ponto--urgente { background: var(--urgente); box-shadow: 0 0 0 3px var(--urgente-bg); }
.ponto--atencao { background: var(--atencao); box-shadow: 0 0 0 3px var(--atencao-bg); }
.ponto--padrao  { background: var(--azul);    box-shadow: 0 0 0 3px var(--azul-claro); }

/* ---------- 9. Sumário de fichas ---------- */
.busca-fichas { position: relative; margin-bottom: .9rem; }
.busca-fichas input { padding-left: 2.4rem; font-size: 1rem; }
.busca-fichas::before {
  content: "🔎"; position: absolute; left: .75rem; top: 50%;
  transform: translateY(-50%); font-size: .95rem; opacity: .65;
}

.filtros { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.filtro {
  padding: .38rem .8rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--borda); background: var(--superficie);
  color: var(--texto-suave); font: inherit; font-size: .84rem; font-weight: 600;
}
.filtro:hover { border-color: var(--azul); color: var(--azul); }
.filtro--ativo { background: var(--azul); border-color: var(--azul); color: #fff; }
.filtro--ativo.filtro--urgente { background: var(--urgente); border-color: var(--urgente); }
.filtro--ativo.filtro--atencao { background: var(--atencao); border-color: var(--atencao); }

.alfabeto { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: 1rem; }
.alfabeto button {
  width: 30px; height: 30px; border-radius: var(--raio-p); cursor: pointer;
  border: 1px solid var(--borda); background: var(--superficie);
  color: var(--texto); font: inherit; font-weight: 700; font-size: .82rem;
}
.alfabeto button:hover:not(:disabled) { background: var(--azul); color: #fff; border-color: var(--azul); }
.alfabeto button:disabled { opacity: .3; cursor: default; }

.grupo-letra {
  display: flex; align-items: center; gap: .6rem;
  margin: 1.4rem 0 .6rem; padding-bottom: .3rem;
  border-bottom: 2px solid var(--borda);
}
.grupo-letra span {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--raio-p);
  background: var(--azul-escuro); color: #fff; font-weight: 800; font-size: 1.05rem;
}
.grupo-letra small { color: var(--texto-suave); font-weight: 600; }

/* minmax(0,1fr) e min-width:0 impedem que um item de conteúdo largo — o selo
   "Semanal com gatilho imediato" tem 211 px e não quebra — estique a coluna
   além da largura da tela. */
.lista-fichas { display: grid; gap: .55rem; grid-template-columns: minmax(0, 1fr); }

.ficha-item {
  display: flex; align-items: center; gap: .8rem;
  padding: .75rem .9rem; text-align: left; width: 100%; min-width: 0;
  background: var(--superficie); border: 1px solid var(--borda);
  border-left: 5px solid var(--azul);
  border-radius: var(--raio-p); cursor: pointer; font: inherit;
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.ficha-item:hover { transform: translateX(3px); box-shadow: var(--sombra); }
.ficha-item--urgente { border-left-color: var(--urgente); background: var(--urgente-bg); }
.ficha-item--atencao { border-left-color: var(--atencao); background: var(--atencao-bg); }

.ficha-item__corpo { flex: 1 1 auto; min-width: 0; }
.ficha-item__nome { font-weight: 700; font-size: .97rem; display: block; overflow-wrap: anywhere; }
.ficha-item__meta { font-size: .8rem; color: var(--texto-suave); overflow-wrap: anywhere; }
.ficha-item__seta { color: var(--texto-suave); font-size: 1.2rem; flex: 0 0 auto; }

/* ---------- 10. Painel lateral (detalhe da ficha) ---------- */
.sobreposicao {
  position: fixed; inset: 0; background: rgba(8,20,36,.55);
  z-index: 60; display: flex; justify-content: flex-end;
  animation: aparecer .16s ease-out;
}
@keyframes aparecer { from { opacity: 0; } }

.painel {
  width: min(560px, 100%); height: 100%; overflow-y: auto;
  background: var(--superficie); box-shadow: var(--sombra-forte);
  animation: deslizar .2s ease-out;
}
@keyframes deslizar { from { transform: translateX(24px); opacity: .6; } }

.painel__cabecalho {
  position: sticky; top: 0; z-index: 2;
  padding: 1rem 1.1rem; border-bottom: 1px solid var(--borda);
  background: var(--superficie);
  display: flex; align-items: flex-start; gap: .8rem;
}
.painel__cabecalho h2 { font-size: 1.15rem; }
.painel__fechar {
  background: none; border: 0; font-size: 1.5rem; line-height: 1;
  cursor: pointer; color: var(--texto-suave); padding: 0 .2rem;
}
.painel__corpo { padding: 1.1rem; }

/* ---------- 11. Avisos ---------- */
.aviso {
  display: flex; gap: .7rem; padding: .85rem 1rem;
  border-radius: var(--raio-p); border: 1px solid var(--borda);
  background: var(--azul-claro); font-size: .9rem; margin-bottom: 1rem;
}
.aviso__icone { font-size: 1.15rem; flex: 0 0 auto; line-height: 1.3; }
.aviso strong { display: block; margin-bottom: .15rem; }
.aviso--urgente { background: var(--urgente-bg); border-color: var(--urgente-borda); }
.aviso--atencao { background: var(--atencao-bg); border-color: var(--atencao-borda); }
.aviso--sucesso { background: var(--sucesso-bg); border-color: var(--sucesso); }

/* ---------- 12. Indicadores ---------- */
.indicador {
  background: var(--superficie); border: 1px solid var(--borda);
  border-radius: var(--raio); padding: .95rem 1rem; box-shadow: var(--sombra);
}
.indicador__rotulo {
  font-size: .78rem; color: var(--texto-suave); font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
}
.indicador__valor { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.indicador__nota { font-size: .8rem; color: var(--texto-suave); }
.indicador--urgente { border-top: 4px solid var(--urgente); }
.indicador--urgente .indicador__valor { color: var(--urgente); }
.indicador--atencao { border-top: 4px solid var(--atencao); }
.indicador--padrao  { border-top: 4px solid var(--azul); }
.indicador--sucesso { border-top: 4px solid var(--sucesso); }

/* ---------- 13. Tabelas ---------- */
.tabela-rolagem { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tabela { width: 100%; border-collapse: collapse; font-size: .89rem; }
table.tabela th, table.tabela td {
  padding: .58rem .65rem; text-align: left; border-bottom: 1px solid var(--borda);
  vertical-align: top;
}
table.tabela th {
  background: var(--azul-claro); font-weight: 700; font-size: .8rem;
  text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}
table.tabela tbody tr:hover { background: var(--azul-claro); }
.tabela__vazia { text-align: center; padding: 2rem; color: var(--texto-suave); }

/* ---------- 14. Barras (relatórios) ---------- */
.barra-linha {
  display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto;
  gap: .7rem; align-items: center; margin-bottom: .5rem; font-size: .87rem;
}
.barra-linha__rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra-linha__trilho {
  height: 16px; background: var(--fundo); border-radius: 8px;
  border: 1px solid var(--borda); overflow: hidden;
}
.barra-linha__preenchimento { height: 100%; background: var(--azul); border-radius: 8px 0 0 8px; }
.barra-linha__preenchimento--urgente { background: var(--urgente); }
.barra-linha__preenchimento--atencao { background: var(--atencao); }
.barra-linha__valor { font-weight: 700; min-width: 2.4rem; text-align: right; }

/* ---------- 15. Anexos ---------- */
.zona-anexo {
  border: 2px dashed var(--borda); border-radius: var(--raio);
  padding: 1.4rem 1rem; text-align: center; cursor: pointer;
  color: var(--texto-suave); background: var(--fundo); transition: border-color .15s, background .15s;
}
.zona-anexo:hover, .zona-anexo--sobre { border-color: var(--azul); background: var(--azul-claro); }
.zona-anexo strong { display: block; color: var(--texto); font-size: 1rem; }

.lista-anexos { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; gap: .45rem; }
.anexo-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .55rem .7rem; border: 1px solid var(--borda);
  border-radius: var(--raio-p); background: var(--superficie); font-size: .87rem;
}
.anexo-item__nome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.anexo-item__miniatura {
  width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
  border: 1px solid var(--borda); flex: 0 0 auto; background: var(--fundo);
}

/* ---------- 16. QR Code ---------- */
.qr-caixa {
  display: inline-block; padding: 14px; background: #fff;
  border: 1px solid var(--borda); border-radius: var(--raio);
}
.qr-caixa canvas { display: block; image-rendering: pixelated; width: 220px; height: 220px; }

/* ---------- 17. Comprovante / impressão ---------- */
.comprovante {
  border: 2px solid var(--azul-escuro); border-radius: var(--raio);
  padding: 1.1rem; background: var(--superficie);
}
.comprovante__cabecalho {
  display: flex; align-items: center; gap: .8rem;
  border-bottom: 2px solid var(--azul-escuro); padding-bottom: .7rem; margin-bottom: .8rem;
}
.comprovante__protocolo {
  font-family: "Consolas", "Courier New", monospace;
  font-size: 1.25rem; font-weight: 800; letter-spacing: .06em; color: var(--azul-escuro);
}
.dados-lista { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.dados-lista div { font-size: .89rem; }
.dados-lista dt { font-size: .75rem; color: var(--texto-suave); text-transform: uppercase;
                  letter-spacing: .03em; font-weight: 700; }
.dados-lista dd { margin: 0; font-weight: 600; }

/* ---------- 18. Rodapé ---------- */
.rodape {
  border-top: 1px solid var(--borda); margin-top: 2rem; padding: 1.2rem 1rem 2rem;
  color: var(--texto-suave); font-size: .82rem; text-align: center;
}
.rodape a { color: var(--texto-suave); }

/* ---------- 19. Notificações flutuantes ---------- */
.avisos-flutuantes {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 90;
  display: flex; flex-direction: column; gap: .5rem; max-width: 360px;
}
.torrada {
  padding: .8rem 1rem; border-radius: var(--raio-p); color: #fff;
  background: var(--azul-escuro); box-shadow: var(--sombra-forte);
  font-size: .9rem; animation: surgir .18s ease-out;
}
.torrada--sucesso { background: var(--sucesso); }
.torrada--erro    { background: var(--urgente); }
.torrada--atencao { background: var(--atencao); }

/* ---------- 20. Responsivo ---------- */
/* No celular o selo de prazo desce para a própria linha, alinhado ao texto:
   cabe inteiro e continua sendo a primeira coisa que se lê depois do nome. */
@media (max-width: 560px) {
  .ficha-item { flex-wrap: wrap; row-gap: .4rem; }
  .ficha-item__corpo { flex: 1 1 calc(100% - 1.6rem); }
  .ficha-item__seta { display: none; }
  .ficha-item .selo { margin-left: 1.6rem; white-space: normal; }
}

@media (max-width: 620px) {
  .cabecalho__titulo strong { font-size: 1.08rem; }
  .conteudo { padding: 1rem .8rem 3rem; }
  .cartao { padding: .9rem; }
  .indicador__valor { font-size: 1.6rem; }
}

/* ---------- 21. Impressão ---------- */
@media print {
  .cabecalho, .navegacao, .rodape, .avisos-flutuantes,
  .nao-imprimir, .botao, .filtros, .alfabeto, .busca-fichas { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .conteudo { max-width: none; padding: 0; }
  .cartao, .comprovante { box-shadow: none; border: 1px solid #999; page-break-inside: avoid; }
  .ficha-item { break-inside: avoid; }
  .ficha-item--urgente { border-left: 5px solid #000 !important; }
  a[href]::after { content: ""; }
}

</style>

<script>
/* =========================================================================
   HABE SINAN — funções utilitárias compartilhadas entre as páginas
   ========================================================================= */

var U = (function () {
  'use strict';

  /* ---------- DOM ---------- */

  function $(seletor, contexto) {
    return (contexto || document).querySelector(seletor);
  }

  function $$(seletor, contexto) {
    return Array.prototype.slice.call((contexto || document).querySelectorAll(seletor));
  }

  /* Escapa texto para inserção segura em HTML. */
  function esc(valor) {
    if (valor === null || valor === undefined) { return ''; }
    return String(valor)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* Remove acentos e coloca em minúsculas — usado na busca. */
  function normalizar(texto) {
    return String(texto || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  /* ---------- datas ---------- */

  function hoje() {
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  /* Converte 'AAAA-MM-DD' em Date local (evita o deslocamento de fuso do ISO). */
  function paraData(texto) {
    if (!texto) { return null; }
    if (texto.length === 10) {
      var p = texto.split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    return new Date(texto);
  }

  function formatarData(texto) {
    var d = paraData(texto);
    if (!d || isNaN(d.getTime())) { return '—'; }
    return String(d.getDate()).padStart(2, '0') + '/' +
           String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  }

  function formatarDataHora(iso) {
    if (!iso) { return '—'; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return '—'; }
    return formatarData(iso) + ' às ' +
           String(d.getHours()).padStart(2, '0') + ':' +
           String(d.getMinutes()).padStart(2, '0');
  }

  /* Semana epidemiológica brasileira: inicia no domingo; a SE 1 é a primeira
     semana do ano com quatro ou mais dias em janeiro. */
  function semanaEpidemiologica(texto) {
    var data = paraData(texto);
    if (!data || isNaN(data.getTime())) { return null; }

    function inicioSe1(ano) {
      var primeiro = new Date(ano, 0, 1);
      var domingo = new Date(ano, 0, 1 - primeiro.getDay());
      /* Se a semana iniciada nesse domingo tem menos de 4 dias em janeiro,
         a SE 1 começa no domingo seguinte. */
      if (primeiro.getDay() > 3) { domingo.setDate(domingo.getDate() + 7); }
      return domingo;
    }

    var ano = data.getFullYear();
    var inicio = inicioSe1(ano);
    if (data < inicio) { ano -= 1; inicio = inicioSe1(ano); }

    var proximoInicio = inicioSe1(ano + 1);
    if (data >= proximoInicio) { ano += 1; inicio = proximoInicio; }

    var semana = Math.floor((data - inicio) / (7 * 24 * 60 * 60 * 1000)) + 1;
    return { ano: ano, semana: semana, rotulo: 'SE ' + String(semana).padStart(2, '0') + '/' + ano };
  }

  function competencia(texto) {
    var d = paraData(texto);
    if (!d || isNaN(d.getTime())) { return '—'; }
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
               'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function competenciaPorExtenso(chave) {
    if (!chave || chave.indexOf('-') < 0) { return chave; }
    var p = chave.split('-');
    return MESES[Number(p[1]) - 1] + '/' + p[0];
  }

  /* ---------- classificação das fichas ---------- */

  function corDaClassificacao(classificacao) {
    var meta = HABE_CATALOGO.classificacoes[classificacao];
    return meta ? meta.cor : 'padrao';
  }

  function rotuloDaClassificacao(classificacao) {
    var meta = HABE_CATALOGO.classificacoes[classificacao];
    return meta ? meta.rotulo : classificacao;
  }

  function prazoDaClassificacao(classificacao) {
    var meta = HABE_CATALOGO.classificacoes[classificacao];
    return meta ? meta.prazo : '';
  }

  function seloClassificacao(ficha) {
    var cor = corDaClassificacao(ficha.classificacao);
    var simbolo = ficha.classificacao === 'imediata' ? '⏱'
                : ficha.classificacao === 'condicional' ? '⚠' : '📅';
    return '<span class="selo selo--' + cor + '">' + simbolo + ' ' +
           esc(rotuloDaClassificacao(ficha.classificacao)) + '</span>';
  }

  /* Prazo-limite concreto a partir da data de atendimento. */
  function prazoLimite(ficha, dataAtendimento) {
    var base = paraData(dataAtendimento) || new Date();
    var limite = new Date(base.getTime());
    if (ficha.classificacao === 'imediata') {
      limite.setDate(limite.getDate() + 1);
      return { data: limite, texto: 'até ' + formatarData(limite.toISOString()) + ' (24 horas)' };
    }
    limite.setDate(limite.getDate() + 7);
    return { data: limite, texto: 'até ' + formatarData(limite.toISOString()) + ' (7 dias)' };
  }

  function destinoNome(id) {
    for (var i = 0; i < HABE_CATALOGO.destinos.length; i++) {
      if (HABE_CATALOGO.destinos[i].id === id) { return HABE_CATALOGO.destinos[i].nome; }
    }
    return id || '—';
  }

  function destinoSigla(id) {
    for (var i = 0; i < HABE_CATALOGO.destinos.length; i++) {
      if (HABE_CATALOGO.destinos[i].id === id) { return HABE_CATALOGO.destinos[i].sigla; }
    }
    return '—';
  }

  /* ---------- perfil da página ---------- */

  /* O sistema tem duas páginas, definidas pela variável HABE_PERFIL que cada
     arquivo HTML declara antes de carregar os scripts:

       'consulta' — usada pelos médicos da urgência e dos ambulatórios. Só
                    consulta prazos e baixa fichas. Não registra, não guarda e
                    nem sequer contém código que lide com dado de paciente.
       'nucleo'   — usada pelo Núcleo Hospitalar de Epidemiologia. Registra as
                    notificações, anexa as fichas digitalizadas e emite os
                    relatórios.

     Na dúvida, assume o perfil mais restrito. */
  function perfilNucleo() {
    return (typeof HABE_PERFIL !== 'undefined') && HABE_PERFIL === 'nucleo';
  }

  /* ---------- contato do Núcleo ---------- */

  function unidade() {
    return HABE_CATALOGO.unidade || {};
  }

  /* Como chamar o Núcleo, em uma linha. Vazio se nada foi cadastrado. */
  function comoChamarNucleo() {
    var u = unidade();
    var partes = [];
    if (u.ramal) { partes.push('ramal ' + u.ramal); }
    if (u.plantao) { partes.push('plantão ' + u.plantao); }
    if (u.email) { partes.push(u.email); }
    return partes.join(' · ');
  }

  /* Bloco de contato exibido ao médico assistente. Em agravo de notificação
     imediata, vem em vermelho e com o verbo no imperativo. */
  function blocoContato(imediata) {
    var u = unidade();
    var contato = comoChamarNucleo();
    var setor = u.setor || 'Núcleo de Epidemiologia';

    if (imediata) {
      return '<div class="aviso aviso--urgente" style="margin-top:1rem">' +
        '<span class="aviso__icone">☎</span><div>' +
        '<strong>Comunique o ' + esc(setor) + ' agora</strong>' +
        (contato
          ? 'Ligue: <strong>' + esc(contato) + '</strong>. '
          : 'Ligue para o ' + esc(setor) + '. ') +
        'A notificação de 24 horas começa na suspeita, não no resultado do exame — ' +
        'a ficha em papel não substitui esse telefonema.' +
        '</div></div>';
    }

    return '<div class="aviso" style="margin-top:1rem">' +
      '<span class="aviso__icone">📨</span><div>' +
      '<strong>Depois de preencher</strong>' +
      'Assine a ficha e encaminhe ao ' + esc(setor) +
      (contato ? ' — ' + esc(contato) : '') + '. ' +
      'É o Núcleo que faz o registro no Sinan.' +
      '</div></div>';
  }

  /* ---------- avisos flutuantes ---------- */

  function torrada(mensagem, tipo, duracao) {
    var caixa = $('#avisosFlutuantes');
    if (!caixa) { return; }
    var item = document.createElement('div');
    item.className = 'torrada' + (tipo ? ' torrada--' + tipo : '');
    item.textContent = mensagem;
    caixa.appendChild(item);
    window.setTimeout(function () {
      item.style.transition = 'opacity .3s';
      item.style.opacity = '0';
      window.setTimeout(function () { item.remove(); }, 300);
    }, duracao || 4200);
  }

  /* ---------- painel lateral ---------- */

  function abrirPainel(titulo, corpoHtml, aoMontar) {
    var raiz = $('#painelDetalhe');
    raiz.innerHTML =
      '<div class="sobreposicao" id="sobreposicaoPainel">' +
        '<div class="painel" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">' +
          '<div class="painel__cabecalho">' +
            '<h2 style="flex:1 1 auto">' + titulo + '</h2>' +
            '<button class="painel__fechar" type="button" aria-label="Fechar">×</button>' +
          '</div>' +
          '<div class="painel__corpo">' + corpoHtml + '</div>' +
        '</div>' +
      '</div>';

    var sobreposicao = $('#sobreposicaoPainel');
    sobreposicao.addEventListener('click', function (evento) {
      if (evento.target === sobreposicao) { fecharPainel(); }
    });
    $('.painel__fechar', raiz).addEventListener('click', fecharPainel);
    document.addEventListener('keydown', escFecha);
    document.body.style.overflow = 'hidden';

    if (typeof aoMontar === 'function') { aoMontar(raiz); }
  }

  function escFecha(evento) {
    if (evento.key === 'Escape') { fecharPainel(); }
  }

  function fecharPainel() {
    $('#painelDetalhe').innerHTML = '';
    document.body.style.overflow = '';
    document.removeEventListener('keydown', escFecha);
  }

  /* ---------- downloads ---------- */

  function baixarConteudo(nomeArquivo, conteudo, tipoMime) {
    var blob = (conteudo instanceof Blob) ? conteudo : new Blob([conteudo], { type: tipoMime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* Nome de arquivo previsível: FICHA_DENGUE_PRONT-12345_2026-08-06.pdf */
  function nomeArquivoFicha(ficha, solicitacao) {
    var pedaco = normalizar(ficha.nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase();
    var prontuario = (solicitacao && solicitacao.pacienteProntuario)
      ? '_PRONT-' + String(solicitacao.pacienteProntuario).replace(/[^\w-]/g, '') : '';
    var data = (solicitacao && solicitacao.dataAtendimento) ? '_' + solicitacao.dataAtendimento : '';
    return 'FICHA_' + pedaco + prontuario + data + '.pdf';
  }

  /* Entrega a ficha: prioriza o acervo local; se não houver, usa o link
     oficial do Ministério da Saúde. Devolve uma Promise com o desfecho. */
  function entregarFicha(ficha, solicitacao) {
    var nome = nomeArquivoFicha(ficha, solicitacao);

    /* Aberto por file:// — o navegador bloqueia fetch, então não há como saber
       de antemão se o PDF existe. O link vai para uma aba nova: se o arquivo
       estiver lá, baixa; se não estiver, o erro fica contido nessa aba em vez
       de derrubar o sistema, que é o que aconteceria navegando a própria
       página para um arquivo inexistente. */
    if (window.location.protocol === 'file:') {
      var a = document.createElement('a');
      a.href = ficha.arquivo;
      a.download = nome;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return Promise.resolve({ origem: 'local-sem-verificacao', nome: nome,
                               arquivo: ficha.arquivo });
    }

    return fetch(ficha.arquivo, { cache: 'no-store' })
      .then(function (resposta) {
        if (!resposta.ok) { throw new Error('sem acervo local'); }
        return resposta.blob();
      })
      .then(function (blob) {
        if (blob.size < 1024) { throw new Error('arquivo inválido'); }
        baixarConteudo(nome, blob, 'application/pdf');
        return { origem: 'local', nome: nome };
      })
      .catch(function () {
        if (ficha.urlOficial) {
          window.open(ficha.urlOficial, '_blank', 'noopener');
          return { origem: 'oficial', url: ficha.urlOficial };
        }
        window.open(HABE_CATALOGO.revisao.portalSinan, '_blank', 'noopener');
        return { origem: 'portal', url: HABE_CATALOGO.revisao.portalSinan };
      });
  }

  /* ---------- CSV ---------- */

  function paraCsv(linhas) {
    return linhas.map(function (linha) {
      return linha.map(function (celula) {
        var texto = (celula === null || celula === undefined) ? '' : String(celula);
        return '"' + texto.replace(/"/g, '""') + '"';
      }).join(';');
    }).join('\r\n');
  }

  function baixarCsv(nomeArquivo, linhas) {
    /* BOM para o Excel reconhecer o UTF-8. */
    baixarConteudo(nomeArquivo, '﻿' + paraCsv(linhas), 'text/csv;charset=utf-8');
  }

  /* ---------- leitura de arquivos ---------- */

  function lerArquivoBase64(arquivo) {
    return new Promise(function (resolver, rejeitar) {
      var leitor = new FileReader();
      leitor.onload = function () {
        var resultado = String(leitor.result);
        resolver(resultado.slice(resultado.indexOf(',') + 1));
      };
      leitor.onerror = function () { rejeitar(new Error('Não foi possível ler o arquivo.')); };
      leitor.readAsDataURL(arquivo);
    });
  }

  /* Reduz fotos grandes antes do envio, mantendo a legibilidade do documento. */
  function comprimirImagem(arquivo, larguraMaxima) {
    larguraMaxima = larguraMaxima || 2000;
    return new Promise(function (resolver) {
      if (arquivo.type.indexOf('image/') !== 0) { return resolver(null); }
      var url = URL.createObjectURL(arquivo);
      var img = new Image();
      img.onload = function () {
        var escala = Math.min(1, larguraMaxima / Math.max(img.width, img.height));
        if (escala >= 1 && arquivo.size < 1200000) { URL.revokeObjectURL(url); return resolver(null); }
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolver(canvas.toDataURL('image/jpeg', 0.86).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolver(null); };
      img.src = url;
    });
  }

  function formatarTamanho(bytes) {
    if (!bytes && bytes !== 0) { return '—'; }
    if (bytes < 1024) { return bytes + ' B'; }
    if (bytes < 1048576) { return (bytes / 1024).toFixed(0) + ' KB'; }
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  /* ---------- diversos ---------- */

  function ordenarPorNome(a, b) {
    return String(a.nome).localeCompare(String(b.nome), 'pt-BR', { sensitivity: 'base' });
  }

  /* Primeira letra do nome, sem acento — usada no sumário alfabético. */
  function inicial(nome) {
    var n = normalizar(nome).replace(/^[^a-z0-9]+/, '');
    var c = n.charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }

  return {
    $: $, $$: $$, esc: esc, normalizar: normalizar,
    perfilNucleo: perfilNucleo, unidade: unidade,
    comoChamarNucleo: comoChamarNucleo, blocoContato: blocoContato,
    hoje: hoje, paraData: paraData, formatarData: formatarData, formatarDataHora: formatarDataHora,
    semanaEpidemiologica: semanaEpidemiologica, competencia: competencia,
    competenciaPorExtenso: competenciaPorExtenso,
    corDaClassificacao: corDaClassificacao, rotuloDaClassificacao: rotuloDaClassificacao,
    prazoDaClassificacao: prazoDaClassificacao, seloClassificacao: seloClassificacao,
    prazoLimite: prazoLimite, destinoNome: destinoNome, destinoSigla: destinoSigla,
    torrada: torrada, abrirPainel: abrirPainel, fecharPainel: fecharPainel,
    baixarConteudo: baixarConteudo, nomeArquivoFicha: nomeArquivoFicha, entregarFicha: entregarFicha,
    paraCsv: paraCsv, baixarCsv: baixarCsv,
    lerArquivoBase64: lerArquivoBase64, comprimirImagem: comprimirImagem,
    formatarTamanho: formatarTamanho,
    ordenarPorNome: ordenarPorNome, inicial: inicial
  };
})();

<script>
/* =========================================================================
   HABE SINAN — sumário alfabético das fichas
   ========================================================================= */

var Paginas = Paginas || {};

Paginas.fichas = (function () {
  'use strict';

  var estado = { termo: '', filtro: 'todas' };

  /* ---------- busca ---------- */

  function textoIndexado(ficha) {
    return U.normalizar([
      ficha.nome,
      ficha.grupo,
      ficha.cid10,
      (ficha.sinonimos || []).join(' '),
      ficha.observacao
    ].join(' '));
  }

  function filtrar(termo, filtro) {
    var alvo = U.normalizar(termo || '');
    return HABE_CATALOGO.fichas.filter(function (ficha) {
      if (filtro && filtro !== 'todas') {
        if (filtro === 'imediata' && ficha.classificacao !== 'imediata') { return false; }
        if (filtro === 'condicional' && ficha.classificacao !== 'condicional') { return false; }
        if (filtro === 'semanal' && ficha.classificacao !== 'semanal') { return false; }
        if (filtro.indexOf('grupo:') === 0 && ficha.grupo !== filtro.slice(6)) { return false; }
      }
      if (!alvo) { return true; }
      return textoIndexado(ficha).indexOf(alvo) >= 0;
    }).sort(U.ordenarPorNome);
  }

  /* ---------- fragmentos de HTML ---------- */

  function itemHtml(ficha) {
    var cor = U.corDaClassificacao(ficha.classificacao);
    var classeItem = cor === 'urgente' ? ' ficha-item--urgente'
                   : cor === 'atencao' ? ' ficha-item--atencao' : '';

    return '' +
      '<button type="button" class="ficha-item' + classeItem + '" data-ficha="' + U.esc(ficha.id) + '">' +
        '<span class="ponto ponto--' + cor + '"></span>' +
        '<span class="ficha-item__corpo">' +
          '<span class="ficha-item__nome">' + U.esc(ficha.nome) + '</span>' +
          '<span class="ficha-item__meta">' +
            U.esc(ficha.grupo) + ' · CID-10 ' + U.esc(ficha.cid10) + ' · ' +
            U.esc(U.prazoDaClassificacao(ficha.classificacao)) +
          '</span>' +
        '</span>' +
        U.seloClassificacao(ficha) +
        '<span class="ficha-item__seta" aria-hidden="true">›</span>' +
      '</button>';
  }

  function grupos() {
    var nomes = {};
    HABE_CATALOGO.fichas.forEach(function (f) { nomes[f.grupo] = true; });
    return Object.keys(nomes).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }

  /* ---------- detalhe ---------- */

  function abrirDetalhe(id) {
    var ficha = HABE_CATALOGO.porId[id];
    if (!ficha) { return; }

    var cor = U.corDaClassificacao(ficha.classificacao);
    var meta = HABE_CATALOGO.classificacoes[ficha.classificacao];

    var corpo = '' +
      '<div class="aviso aviso--' + (cor === 'padrao' ? '' : cor) + '">' +
        '<span class="aviso__icone">' +
          (ficha.classificacao === 'imediata' ? '⏱' : ficha.classificacao === 'condicional' ? '⚠' : '📅') +
        '</span>' +
        '<div>' +
          '<strong>' + U.esc(meta.rotulo) + ' — ' + U.esc(meta.prazo) + '</strong>' +
          U.esc(meta.descricao) +
        '</div>' +
      '</div>' +

      (ficha.gatilhoImediato
        ? '<div class="aviso aviso--urgente">' +
            '<span class="aviso__icone">⏱</span>' +
            '<div><strong>Quando o prazo vira 24 horas</strong>' + U.esc(ficha.gatilhoImediato) + '</div>' +
          '</div>'
        : '') +

      '<dl class="dados-lista" style="margin:0 0 1rem">' +
        '<div><dt>Grupo</dt><dd>' + U.esc(ficha.grupo) + '</dd></div>' +
        '<div><dt>CID-10</dt><dd>' + U.esc(ficha.cid10) + '</dd></div>' +
      '</dl>' +

      (ficha.observacao
        ? '<div class="cartao" style="background:var(--fundo)">' +
            '<h3 style="font-size:.95rem">Orientação operacional</h3>' +
            '<p style="margin:0">' + U.esc(ficha.observacao) + '</p>' +
          '</div>'
        : '') +

      '<div style="display:grid;gap:.5rem;margin-top:1rem">' +
        '<button class="botao botao--grande" id="botaoBaixarFicha">⬇ Baixar a ficha</button>' +
        (U.perfilNucleo()
          ? '<button class="botao botao--secundario" id="botaoRegistrarDaFicha">' +
              '📋 Registrar uma notificação com esta ficha</button>'
          : '') +
        (ficha.urlOficial
          ? '<a class="botao botao--secundario" href="' + U.esc(ficha.urlOficial) + '" ' +
              'target="_blank" rel="noopener">🔗 Abrir no portal do Ministério da Saúde</a>'
          : '<a class="botao botao--secundario" href="' + U.esc(HABE_CATALOGO.revisao.portalSinan) + '" ' +
              'target="_blank" rel="noopener">🔗 Procurar no portal do Sinan</a>') +
      '</div>' +

      (U.perfilNucleo() ? '' : U.blocoContato(ficha.classificacao === 'imediata')) +

      '<p style="font-size:.8rem;color:var(--texto-suave);margin-top:1rem">' +
        'Arquivo no acervo local: <code>' + U.esc(ficha.arquivo) + '</code>' +
        (ficha.urlVerificada ? '' :
          '<br>Link oficial ainda não conferido — o sistema entrega o arquivo do acervo local ' +
          'e, na falta dele, direciona para o portal do Sinan.') +
      '</p>';

    U.abrirPainel(U.esc(ficha.nome), corpo, function () {
      U.$('#botaoBaixarFicha').addEventListener('click', function () {
        U.entregarFicha(ficha, null).then(function (desfecho) {
          if (desfecho.origem === 'local') {
            U.torrada('Ficha baixada: ' + desfecho.nome, 'sucesso');
          } else if (desfecho.origem === 'local-sem-verificacao') {
            U.torrada('Download solicitado: ' + desfecho.nome +
                      '. Se nada baixar, a ficha ainda não está no acervo.');
          } else {
            U.torrada('Ficha ainda não incluída no acervo local — abrindo a versão oficial.', 'atencao');
          }
        });
      });

      var registrar = U.$('#botaoRegistrarDaFicha');
      if (registrar) {
        registrar.addEventListener('click', function () {
          U.fecharPainel();
          window.location.hash = '#/registrar?ficha=' + encodeURIComponent(ficha.id);
        });
      }
    });
  }

  /* ---------- página ---------- */

  function desenharLista(elemento) {
    var achadas = filtrar(estado.termo, estado.filtro);
    var saida = U.$('#listaSumario', elemento);
    var navegacaoLetras = U.$('#alfabeto', elemento);

    /* Barra de letras */
    var letrasPresentes = {};
    achadas.forEach(function (f) { letrasPresentes[U.inicial(f.nome)] = true; });
    var alfabeto = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    navegacaoLetras.innerHTML = alfabeto.map(function (letra) {
      var ativa = !!letrasPresentes[letra];
      return '<button type="button" data-letra="' + letra + '"' + (ativa ? '' : ' disabled') +
             ' title="Ir para a letra ' + letra + '">' + letra + '</button>';
    }).join('');

    if (achadas.length === 0) {
      saida.innerHTML = '<div class="tabela__vazia">' +
        'Nenhuma ficha corresponde à busca. Tente outro termo ou limpe os filtros.<br>' +
        'Se o agravo não estiver no acervo, use a <strong>ficha de notificação individual</strong> ' +
        'e avise o Núcleo de Epidemiologia.</div>';
      U.$('#resumoSumario', elemento).textContent = '0 fichas';
      return;
    }

    var porLetra = {};
    achadas.forEach(function (ficha) {
      var letra = U.inicial(ficha.nome);
      (porLetra[letra] = porLetra[letra] || []).push(ficha);
    });

    saida.innerHTML = Object.keys(porLetra).sort().map(function (letra) {
      var itens = porLetra[letra];
      var imediatas = itens.filter(function (f) { return f.classificacao === 'imediata'; }).length;
      return '' +
        '<div class="grupo-letra" id="letra-' + letra + '">' +
          '<span>' + letra + '</span>' +
          '<small>' + itens.length + (itens.length === 1 ? ' ficha' : ' fichas') +
            (imediatas ? ' · <strong style="color:var(--urgente)">' + imediatas +
                         ' de notificação imediata</strong>' : '') +
          '</small>' +
        '</div>' +
        '<div class="lista-fichas">' + itens.map(itemHtml).join('') + '</div>';
    }).join('');

    var totalImediatas = achadas.filter(function (f) { return f.classificacao === 'imediata'; }).length;
    U.$('#resumoSumario', elemento).innerHTML =
      achadas.length + ' fichas · <strong style="color:var(--urgente)">' +
      totalImediatas + ' de notificação imediata</strong>';
  }

  function render(elemento, parametros) {
    estado.termo = '';
    estado.filtro = 'todas';

    var opcoesGrupo = grupos().map(function (g) {
      return '<option value="grupo:' + U.esc(g) + '">' + U.esc(g) + '</option>';
    }).join('');

    elemento.innerHTML = '' +
      '<div class="pagina__cabecalho">' +
        '<h1 id="t-fichas">Sumário de fichas — ordem alfabética</h1>' +
        '<p>As fichas de <strong>notificação imediata</strong> aparecem destacadas em vermelho, ' +
           'com o selo ⏱ e barra lateral. As de prazo semanal seguem em azul.</p>' +
      '</div>' +

      '<div class="cartao nao-imprimir">' +
        '<div class="busca-fichas">' +
          '<label class="so-leitor-tela" for="buscaSumario">Buscar ficha</label>' +
          '<input type="search" id="buscaSumario" ' +
                 'placeholder="Buscar por doença, sinônimo popular ou CID — ex.: catapora, calazar, A90">' +
        '</div>' +
        '<div class="filtros">' +
          '<button class="filtro filtro--ativo" data-filtro="todas">Todas</button>' +
          '<button class="filtro" data-filtro="imediata">⏱ Imediatas (24 h)</button>' +
          '<button class="filtro" data-filtro="condicional">⚠ Com gatilho imediato</button>' +
          '<button class="filtro" data-filtro="semanal">📅 Semanais (7 dias)</button>' +
          '<select id="filtroGrupo" style="width:auto;padding:.38rem .6rem;font-size:.84rem">' +
            '<option value="">Todos os grupos</option>' + opcoesGrupo +
          '</select>' +
        '</div>' +
        '<div class="alfabeto" id="alfabeto"></div>' +
        '<p style="margin:0;font-size:.87rem;color:var(--texto-suave)" id="resumoSumario"></p>' +
      '</div>' +

      '<div id="listaSumario"></div>';

    var campoBusca = U.$('#buscaSumario', elemento);
    campoBusca.addEventListener('input', function () {
      estado.termo = campoBusca.value;
      desenharLista(elemento);
    });

    U.$$('.filtro[data-filtro]', elemento).forEach(function (botao) {
      botao.addEventListener('click', function () {
        U.$$('.filtro[data-filtro]', elemento).forEach(function (b) {
          b.classList.remove('filtro--ativo', 'filtro--urgente', 'filtro--atencao');
        });
        var valor = botao.getAttribute('data-filtro');
        botao.classList.add('filtro--ativo');
        if (valor === 'imediata') { botao.classList.add('filtro--urgente'); }
        if (valor === 'condicional') { botao.classList.add('filtro--atencao'); }
        U.$('#filtroGrupo', elemento).value = '';
        estado.filtro = valor;
        desenharLista(elemento);
      });
    });

    U.$('#filtroGrupo', elemento).addEventListener('change', function () {
      estado.filtro = this.value || 'todas';
      U.$$('.filtro[data-filtro]', elemento).forEach(function (b) {
        b.classList.remove('filtro--ativo', 'filtro--urgente', 'filtro--atencao');
      });
      if (!this.value) { U.$('.filtro[data-filtro="todas"]', elemento).classList.add('filtro--ativo'); }
      desenharLista(elemento);
    });

    elemento.addEventListener('click', function (evento) {
      var letra = evento.target.closest('[data-letra]');
      if (letra && !letra.disabled) {
        var destino = U.$('#letra-' + letra.getAttribute('data-letra'), elemento);
        if (destino) { destino.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        return;
      }
      var item = evento.target.closest('[data-ficha]');
      if (item) { abrirDetalhe(item.getAttribute('data-ficha')); }
    });

    desenharLista(elemento);

    /* Abertura direta via #/fichas?ficha=id */
    if (parametros && parametros.ficha) { abrirDetalhe(parametros.ficha); }
  }

  return {
    render: render,
    filtrar: filtrar,
    itemHtml: itemHtml,
    abrirDetalhe: abrirDetalhe
  };
})();

</script>
<script>
/* =========================================================================
   HABE SINAN — página de consulta (urgência e ambulatórios)
   -------------------------------------------------------------------------
   Aplicação enxuta, com duas telas: o sumário alfabético das fichas e a
   orientação de como notificar. Não depende da camada de armazenamento nem
   do gerador de QR Code — de propósito: quanto menos esta página souber
   fazer, menos ela pode expor.

   A preferência de tema é a única coisa que ela grava, e num único campo.
   ========================================================================= */

var Paginas = Paginas || {};

/* ---------------------------------------------------------------------
   Tela: como notificar
   --------------------------------------------------------------------- */
Paginas.notificar = (function () {
  'use strict';

  function cartaoPrazo(chave) {
    var meta = HABE_CATALOGO.classificacoes[chave];
    var borda = meta.cor === 'urgente' ? 'var(--urgente)'
              : meta.cor === 'atencao' ? 'var(--atencao)' : 'var(--azul)';
    var simbolo = chave === 'imediata' ? '⏱' : chave === 'condicional' ? '⚠' : '📅';

    return '<div class="cartao" style="margin:0;border-left:5px solid ' + borda + '">' +
      '<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem">' +
        '<span class="ponto ponto--' + meta.cor + '"></span>' +
        '<strong>' + simbolo + ' ' + U.esc(meta.rotulo) + '</strong>' +
      '</div>' +
      '<p style="margin:0 0 .5rem"><span class="selo selo--' + meta.cor + '">' +
        U.esc(meta.prazo) + '</span></p>' +
      '<p style="margin:0;font-size:.88rem;color:var(--texto-suave)">' +
        U.esc(meta.descricao) + '</p>' +
    '</div>';
  }

  function render(elemento) {
    var u = U.unidade();
    var contato = U.comoChamarNucleo();

    elemento.innerHTML = '' +
      '<div class="pagina__cabecalho">' +
        '<h1 id="t-notificar">Como notificar</h1>' +
        '<p>O que fazer, na ordem, quando o caso for de notificação compulsória.</p>' +
      '</div>' +

      '<div class="aviso aviso--urgente">' +
        '<span class="aviso__icone">☎</span>' +
        '<div>' +
          '<strong>Agravo em vermelho: ligue para o ' + U.esc(u.setor || 'Núcleo') + ' agora</strong>' +
          (contato ? 'Contato: <strong>' + U.esc(contato) + '</strong>. ' : '') +
          'A contagem das 24 horas começa na <em>suspeita</em> — não espere resultado de ' +
          'exame, e não conte com a ficha em papel para dar o aviso.' +
        '</div>' +
      '</div>' +

      '<div class="cartao">' +
        '<h2 style="font-size:1.05rem">Os cinco passos</h2>' +
        '<ol style="padding-left:1.2rem;line-height:1.9;margin:0">' +
          '<li><strong>Identifique o agravo</strong> em <a href="#/fichas">Fichas A–Z</a>. ' +
              'Pode buscar pelo nome popular — <em>catapora</em>, <em>calazar</em> — ou pelo CID.</li>' +
          '<li><strong>Confira a cor.</strong> Vermelho é 24 horas; laranja é semanal, mas vira ' +
              '24 horas nas situações descritas na própria ficha; azul é semanal.</li>' +
          '<li><strong>Se for vermelho, ligue.</strong> Antes de qualquer papel.</li>' +
          '<li><strong>Baixe e preencha</strong> a ficha, com letra legível e sem abreviar o ' +
              'nome do paciente.</li>' +
          '<li><strong>Assine e encaminhe</strong> ao ' + U.esc(u.setor || 'Núcleo de Epidemiologia') +
              '. É o Núcleo que lança no Sinan e responde pelos prazos junto à vigilância.</li>' +
        '</ol>' +
      '</div>' +

      '<div class="cartao">' +
        '<h2 style="font-size:1.05rem">Como identificar o prazo</h2>' +
        '<div class="grade grade--3" style="margin-top:.8rem">' +
          cartaoPrazo('imediata') + cartaoPrazo('condicional') + cartaoPrazo('semanal') +
        '</div>' +
      '</div>' +

      '<div class="cartao">' +
        '<h2 style="font-size:1.05rem">' + U.esc(u.setor || 'Núcleo de Epidemiologia') + '</h2>' +
        (contato || u.horario
          ? '<dl class="dados-lista">' +
              (u.ramal ? '<div><dt>Ramal</dt><dd>' + U.esc(u.ramal) + '</dd></div>' : '') +
              (u.plantao ? '<div><dt>Plantão</dt><dd>' + U.esc(u.plantao) + '</dd></div>' : '') +
              (u.email ? '<div><dt>E-mail</dt><dd>' + U.esc(u.email) + '</dd></div>' : '') +
              (u.horario ? '<div><dt>Horário</dt><dd>' + U.esc(u.horario) + '</dd></div>' : '') +
            '</dl>'
          : '') +
        /* O horário sozinho não serve: sem telefone, a página manda ligar sem
           dizer para onde. O aviso depende do contato, não do horário. */
        (contato ? ''
          : '<div class="aviso aviso--atencao" style="margin:0"><span class="aviso__icone">✎</span>' +
            '<div><strong>Contato ainda não cadastrado</strong>' +
            'O ramal e o telefone de plantão do Núcleo precisam ser preenchidos em ' +
            '<code>assets/js/dados-fichas.js</code>, no bloco <code>unidade</code>, ' +
            'antes de distribuir esta página aos consultórios.</div></div>') +
      '</div>' +

      '<div class="cartao" style="background:var(--fundo)">' +
        '<h2 style="font-size:1rem">Três lembretes</h2>' +
        '<ul style="padding-left:1.2rem;line-height:1.8;margin:0;font-size:.93rem">' +
          '<li>Notifica-se a <strong>suspeita</strong>, não a confirmação.</li>' +
          '<li>Na dúvida sobre qual ficha usar, escolha a <strong>notificação individual</strong> ' +
              '(a ficha genérica do Sinan) e avise o Núcleo — melhor notificar a mais.</li>' +
          '<li>Notificação compulsória independe de autorização do paciente ou de boletim de ' +
              'ocorrência.</li>' +
        '</ul>' +
      '</div>';
  }

  return { render: render };
})();

/* ---------------------------------------------------------------------
   Aplicação
   --------------------------------------------------------------------- */
var App = (function () {
  'use strict';

  var ROTA_PADRAO = 'fichas';
  var CHAVE_TEMA = 'habe_sinan_tema';

  /* ---------- tema ---------- */

  function temaGuardado() {
    try { return window.localStorage.getItem(CHAVE_TEMA) || ''; } catch (e) { return ''; }
  }

  function temaEfetivo() {
    var escolhido = temaGuardado();
    if (escolhido === 'claro' || escolhido === 'escuro') { return escolhido; }
    var doVisualizador = document.documentElement.getAttribute('data-theme');
    if (doVisualizador === 'dark') { return 'escuro'; }
    if (doVisualizador === 'light') { return 'claro'; }
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'escuro' : 'claro';
  }

  function aplicarTema() {
    var tema = temaEfetivo();
    document.documentElement.setAttribute('data-tema', tema);
    var botao = U.$('#botaoTema');
    if (botao) { botao.classList.toggle('botao-icone--ativo', tema === 'escuro'); }
  }

  function alternarTema() {
    var novo = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
    try { window.localStorage.setItem(CHAVE_TEMA, novo); } catch (e) { /* modo privado */ }
    aplicarTema();
  }

  function seguirTemaDoAmbiente() {
    function reaplicar() {
      var escolhido = temaGuardado();
      if (escolhido !== 'claro' && escolhido !== 'escuro') { aplicarTema(); }
    }
    if (window.matchMedia) {
      var consulta = window.matchMedia('(prefers-color-scheme: dark)');
      if (consulta.addEventListener) { consulta.addEventListener('change', reaplicar); }
    }
    if (window.MutationObserver) {
      new window.MutationObserver(reaplicar).observe(document.documentElement,
        { attributes: true, attributeFilter: ['data-theme'] });
    }
  }

  /* ---------- navegação ---------- */

  function lerRota() {
    var bruto = window.location.hash.replace(/^#\/?/, '');
    var partes = bruto.split('?');
    var nome = partes[0] || ROTA_PADRAO;
    var parametros = {};
    if (partes[1]) {
      partes[1].split('&').forEach(function (par) {
        var kv = par.split('=');
        parametros[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
    }
    if (!Paginas[nome]) { nome = ROTA_PADRAO; }
    return { nome: nome, parametros: parametros };
  }

  function navegar() {
    var rota = lerRota();
    U.fecharPainel();

    U.$$('.pagina').forEach(function (secao) {
      secao.classList.add('oculto');
      if (secao.id !== 'pagina-' + rota.nome) { secao.innerHTML = ''; }
    });
    U.$$('.navegacao a').forEach(function (link) {
      link.classList.toggle('ativo', link.getAttribute('data-rota') === rota.nome);
    });

    var elemento = U.$('#pagina-' + rota.nome);
    if (!elemento) { window.location.hash = '#/' + ROTA_PADRAO; return; }
    elemento.classList.remove('oculto');

    try {
      Paginas[rota.nome].render(elemento, rota.parametros);
    } catch (erro) {
      console.error(erro);
      elemento.innerHTML = '<div class="aviso aviso--urgente"><span class="aviso__icone">⚠</span>' +
        '<div><strong>Falha ao montar a página</strong>' + U.esc(erro.message) + '</div></div>';
    }

    window.scrollTo({ top: 0 });
  }

  /* ---------- rodapé ---------- */

  function aplicarIdentidade() {
    var u = U.unidade();

    var titulo = U.$('#rodapeUnidade');
    if (titulo) {
      titulo.textContent = (u.nome || '') + (u.setor ? ' · ' + u.setor : '');
    }

    var revisao = U.$('#rodapeRevisao');
    if (revisao) {
      revisao.innerHTML =
        HABE_CATALOGO.fichas.length + ' agravos catalogados · catálogo versão ' +
        U.esc(HABE_CATALOGO.revisao.versao) + ', de ' +
        U.formatarData(HABE_CATALOGO.revisao.atualizadoEm) +
        '<br><span style="font-size:.78rem">' + U.esc(HABE_CATALOGO.revisao.baseNormativa) + '</span>';
    }

    var contato = U.$('#rodapeContato');
    if (contato) {
      var comoChamar = U.comoChamarNucleo();
      contato.innerHTML = comoChamar
        ? 'Notificação imediata deve ser comunicada por telefone: <strong>' +
          U.esc(comoChamar) + '</strong>.'
        : 'Notificação imediata deve ser comunicada por telefone ao ' +
          U.esc(u.setor || 'Núcleo de Epidemiologia') + ', além do registro da ficha.';
    }
  }

  /* ---------- inicialização ---------- */

  function iniciar() {
    aplicarTema();
    seguirTemaDoAmbiente();
    aplicarIdentidade();

    U.$('#botaoTema').addEventListener('click', alternarTema);
    U.$('#botaoImprimir').addEventListener('click', function () { window.print(); });

    window.addEventListener('hashchange', navegar);
    document.addEventListener('click', function (evento) {
      var link = evento.target.closest('a[href^="#/"]');
      if (link && link.getAttribute('href') === window.location.hash) {
        evento.preventDefault();
        navegar();
      }
    });

    if (!window.location.hash) { window.location.hash = '#/' + ROTA_PADRAO; }
    navegar();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }

  return { navegar: navegar, aplicarIdentidade: aplicarIdentidade };
})();

</script>
</body>
</html>
