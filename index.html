<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Consulta das fichas de notificação compulsória do SINAN — prazos e download. Hospital de Aeronáutica de Belém.">
<meta name="theme-color" content="#0b2f5c">
<title>HABE SINAN — Consulta de Fichas de Notificação</title>
<link rel="icon" href="assets/img/logo-habe.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

<!--
  PÁGINA DE CONSULTA — urgência e ambulatórios.

  Serve a um propósito só: descobrir o prazo de notificação de um agravo e
  baixar a ficha correta. Não registra paciente, não guarda nada e não carrega
  nenhum código que lide com dado pessoal — por isso pode ser distribuída à
  vontade por QR Code e atalho.

  O registro das notificações fica em nucleo.html, na pasta restrita do Núcleo.
-->
<script>var HABE_PERFIL = 'consulta';</script>

<a class="so-leitor-tela" href="#conteudo">Ir direto ao conteúdo</a>

<header class="cabecalho">
  <div class="cabecalho__topo">
    <img class="cabecalho__logo" src="assets/img/logo-habe.svg" alt="Brasão do Hospital de Aeronáutica de Belém">
    <div class="cabecalho__titulo">
      <strong>HABE SINAN</strong>
      <span id="rodapeUnidade">Consulta de fichas de notificação compulsória</span>
    </div>
    <div class="cabecalho__acoes">
      <button class="botao-icone" id="botaoTema" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button>
      <button class="botao-icone" id="botaoImprimir" type="button" title="Imprimir" aria-label="Imprimir">🖨</button>
    </div>
  </div>

  <nav class="navegacao" aria-label="Navegação principal">
    <ul class="navegacao__lista">
      <li><a href="#/fichas"    data-rota="fichas">Fichas A–Z</a></li>
      <li><a href="#/notificar" data-rota="notificar">Como notificar</a></li>
    </ul>
  </nav>
</header>

<main class="conteudo" id="conteudo">
  <section class="pagina oculto" id="pagina-fichas"    aria-labelledby="t-fichas"></section>
  <section class="pagina oculto" id="pagina-notificar" aria-labelledby="t-notificar"></section>
</main>

<footer class="rodape">
  <p>
    <strong>HABE SINAN</strong> · Consulta de fichas de notificação compulsória<br>
    <span id="rodapeRevisao"></span>
  </p>
  <p class="nao-imprimir" id="rodapeContato"></p>
</footer>

<div class="avisos-flutuantes" id="avisosFlutuantes" aria-live="polite"></div>
<div id="painelDetalhe"></div>

<script src="assets/js/dados-fichas.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/paginas/fichas.js"></script>
<script src="assets/js/consulta.js"></script>

</body>
</html>
